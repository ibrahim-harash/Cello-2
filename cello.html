<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشيللو | الروابط الرسمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(239, 68, 68, 0.25);
            --red-gradient: linear-gradient(135deg, #fca5a5 0%, #ef4444 50%, #991b1b 100%);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(239, 68, 68, 0.14) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(185, 28, 28, 0.14) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            overflow-x: hidden;
        }

        /* شاشة الترحيب */
        #splash-screen {
            position: fixed;
            inset: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, rgba(239, 68, 68, 0.16) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ef4444;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.5);
            margin-bottom: 18px;
            animation: pulseLogo 2s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(239, 68, 68, 0.45); }
            50% { transform: scale(1.05); box-shadow: 0 0 45px rgba(248, 113, 113, 0.7); }
        }

        .splash-title {
            font-size: 34px;
            font-weight: 900;
            background: linear-gradient(to right, #fef08a, #f59e0b, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .loader-track {
            width: 240px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b45309, #f59e0b, #fde047, #f59e0b);
            background-size: 200% 100%;
            border-radius: 999px;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.8);
            animation: fillGoldBar 2s cubic-bezier(0.4, 0, 0.2, 1) forwards, shimmerGold 1.5s linear infinite;
        }

        @keyframes fillGoldBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes shimmerGold {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* الحاوية الرئيسية */
        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 35px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .brand-logo-wrapper {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
            border-radius: 50%;
            padding: 3px;
            background: var(--red-gradient);
            box-shadow: 0 10px 28px rgba(239, 68, 68, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background-color: #0b0f19;
        }

        .brand-title {
            font-size: 34px;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, #fca5a5, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
            border-color: #ef4444;
            box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.25);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .wa-channel .icon-box { background: rgba(37, 211, 102, 0.15); color: #25d366; }
        .wa-channel:hover { border-color: #25d366; }

        .location-btn .icon-box { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .location-btn:hover { border-color: #ef4444; }

        .arrow-icon {
            color: var(--text-muted);
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .link-btn:hover .arrow-icon {
            transform: translateX(-4px);
            color: #fff;
        }

        /* Sham Cash Section */
        .shamcash-card {
            margin-top: 22px;
            background: linear-gradient(145deg, rgba(127, 29, 29, 0.25), rgba(30, 58, 138, 0.2));
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 20px;
            padding: 18px;
            text-align: center;
        }

        .sc-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
            color: #fca5a5;
            margin-bottom: 12px;
        }

        .sc-code-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .sc-code {
            font-family: monospace;
            font-size: 12px;
            color: #cbd5e1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            direction: ltr;
        }

        .copy-btn {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .copy-btn:hover { background: #b91c1c; }
        .copy-btn.copied { background: #10b981; }

        .qr-actions {
            display: flex;
            gap: 10px;
        }

        .qr-action-btn {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all 0.2s;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .btn-show-qr {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .btn-show-qr:hover { background: rgba(239, 68, 68, 0.25); color: #fff; }

        .btn-download-qr {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
        }
        .btn-download-qr:hover { opacity: 0.9; transform: translateY(-1px); }

        /* QR Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #1e293b;
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 24px;
            padding: 25px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            position: relative;
            animation: popIn 0.25s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 16px;
            border-radius: 18px;
            display: inline-block;
            margin: 15px 0;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .modal-name {
            font-size: 16px;
            font-weight: 700;
            color: #f87171;
            margin-bottom: 4px;
        }

        .modal-id {
            font-family: monospace;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 16px;
            word-break: break-all;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- شاشة الترحيب -->
    <div id="splash-screen">
        <img src="brado.jpg" alt="شعار تشيللو" class="splash-logo">
        <div class="splash-title">تشيللو</div>
        <div class="loader-track">
            <div class="loader-bar"></div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container">
        <div class="brand-logo-wrapper">
            <img src="brado.jpg" alt="شعار شركة تشيللو" class="brand-logo-img">
        </div>
        <h1 class="brand-title">تشيللو</h1>
        <p class="brand-subtitle">المنصة الرسمية للروابط والتواصل</p>

        <div class="links-list">
            <!-- 1. قناة الواتساب -->
            <a href="https://whatsapp.com/channel/0029Vb9oJCf3bbUvyO5n3G16" target="_blank" class="link-btn wa-channel">
                <div class="btn-content">
                    <div class="icon-box"><i class="fab fa-whatsapp"></i></div>
                    <span>قناة الواتساب الرسمية</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- 2. موقع الشركة -->
            <a href="https://maps.app.goo.gl/fBmRT7D4zj98PnjT9" target="_blank" class="link-btn location-btn">
                <div class="btn-content">
                    <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>
                    <span>موقع الشركة على الخريطة</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>
        </div>

        <!-- 3. قسم الدفع عبر شام كاش -->
        <div class="shamcash-card">
            <div class="sc-header">
                <i class="fas fa-wallet"></i>
                <span>الدفع عبر شام كاش (Sham Cash)</span>
            </div>
            
            <!-- مربع نسخ الـ ID -->
            <div class="sc-code-box">
                <span class="sc-code" id="shamCode">a1ba7001a8e167b9d7ff475ac6fd5130</span>
                <button class="copy-btn" id="copyBtn" onclick="copyShamCash()">
                    <i class="far fa-copy"></i>
                    <span id="copyText">نسخ ID</span>
                </button>
            </div>

            <!-- أزرار عرض وتنزيل صورة QR -->
            <div class="qr-actions">
                <button class="qr-action-btn btn-show-qr" onclick="openQrModal()">
                    <i class="fas fa-qrcode"></i>
                    <span>عرض الباركود</span>
                </button>
                <button class="qr-action-btn btn-download-qr" onclick="downloadQrImage()">
                    <i class="fas fa-download"></i>
                    <span>تنزيل صورة QR</span>
                </button>
            </div>
        </div>

        <div class="footer">
            جميع الحقوق محفوظة © تشيللو
        </div>
    </div>

    <!-- نافذة عرض الباركود -->
    <div class="modal-overlay" id="qrModal" onclick="closeQrModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeQrModal(event)"><i class="fas fa-times"></i></button>
            <div style="color: #fca5a5; font-weight: 700; font-size: 16px;">باركود شام كاش</div>
            
            <div class="qr-wrapper" id="qrcodeContainer"></div>
            
            <div class="modal-name">تشيللو</div>
            <div class="modal-id">a1ba7001a8e167b9d7ff475ac6fd5130</div>
            
            <button class="qr-action-btn btn-download-qr" style="width: 100%; padding: 12px;" onclick="downloadQrImage()">
                <i class="fas fa-download"></i>
                <span>حفظ الصورة في الاستديو</span>
            </button>
        </div>
    </div>

    <script>
        // إخفاء شاشة الترحيب بعد انتهاء شريط التحميل
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hidden');
            }, 2150);
        });

        const shamCashId = "a1ba7001a8e167b9d7ff475ac6fd5130";

        const qr = new QRCode(document.getElementById("qrcodeContainer"), {
            text: shamCashId,
            width: 210,
            height: 210,
            colorDark : "#364f7c",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        function copyShamCash() {
            const btn = document.getElementById('copyBtn');
            const btnText = document.getElementById('copyText');

            navigator.clipboard.writeText(shamCashId).then(() => {
                btn.classList.add('copied');
                btnText.innerText = 'تم النسخ!';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btnText.innerText = 'نسخ ID';
                }, 2500);
            });
        }

        function openQrModal() {
            document.getElementById('qrModal').classList.add('active');
        }

        function closeQrModal(e) {
            document.getElementById('qrModal').classList.remove('active');
        }

        function downloadQrImage() {
            const qrCanvas = document.querySelector('#qrcodeContainer canvas');
            if (!qrCanvas) return;

            const exportCanvas = document.createElement('canvas');
            const padding = 30;
            exportCanvas.width = qrCanvas.width + (padding * 2);
            exportCanvas.height = qrCanvas.height + (padding * 2);
            
            const ctx = exportCanvas.getContext('2d');
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            ctx.drawImage(qrCanvas, padding, padding);

            const link = document.createElement('a');
            link.download = 'Cello-ShamCash-QR.png';
            link.href = exportCanvas.toDataURL('image/png');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
